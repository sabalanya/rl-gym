requires-python = ">=3.14"
dependencies = [
    "gymnasium[box2d,classic-control]>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=8.0",
]

